name: Get-AMD64-Docker-Images-Release

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '填写 Docker 镜像名称，多个镜像使用英文逗号分隔'
        required: true
        default: 'alpine:latest'

permissions:
  contents: write

jobs:
  pull_and_package:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Pull Package Split
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          images="${{ inputs.docker_images }}"
          IFS=',' read -r -a image_array <<< "$images"

          for image in "${image_array[@]}"; do
            image="$(echo "$image" | xargs)"
            [ -z "$image" ] && continue

            echo "=========================================="
            echo "处理镜像：$image"
            echo "=========================================="

            echo "[1/5] docker pull"
            docker pull --platform linux/amd64 "$image"

            image_name="$(echo "$image" | sed 's#[/:@]#_#g')"
            gz_file="${image_name}-amd64.tar.gz"

            echo "[2/5] docker save + gzip"
            docker save "$image" | gzip -1 > "dist/$gz_file"

            echo "压缩后大小："
            ls -lh "dist/$gz_file"

            echo "[3/5] SHA256"
            (
              cd dist
              sha256sum "$gz_file" > "${gz_file}.sha256"
            )

            size=$(stat -c%s "dist/$gz_file")
            limit=$((1800 * 1024 * 1024))

            if [ "$size" -gt "$limit" ]; then
              echo "[4/5] 文件超过 1.8GiB，开始分卷"
              split \
                -b 1800M \
                -d \
                -a 3 \
                "dist/$gz_file" \
                "dist/${gz_file}.part-"

              rm -f "dist/$gz_file"
            else
              echo "[4/5] 文件未超过 1.8GiB，无需分卷"
            fi

            echo "[5/5] 完成：$image"
          done

      - name: Show Files
        shell: bash
        run: |
          echo "=========================================="
          echo "最终待上传文件"
          echo "=========================================="
          ls -lh dist/

      - name: Upload Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="DockerTarBuilder-AMD64"
          RELEASE_NAME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M Build for x86-64')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，更新 Release"
            gh release edit "$TAG" --title "$RELEASE_NAME"
            gh release upload "$TAG" dist/* --clobber
          else
            echo "创建新 Release"
            gh release create "$TAG" dist/* \
              --title "$RELEASE_NAME" \
              --notes "Docker AMD64 离线镜像。超过 1.8GiB 的文件已自动分卷。"
          fi

          echo "Release 上传完成"
