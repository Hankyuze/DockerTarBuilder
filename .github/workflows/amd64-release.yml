name: Get-AMD64-Docker-Images-Release

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称,多个用英文逗号分开'
        required: true
        default: 'alpine:latest,alpine/curl,busybox:stable-glibc'
      notify_email:
        description: '可选：构建完成后通知邮箱（例如 123456@163.com）'
        required: false
        default: ''

jobs:
  pull_and_package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Docker Images and Package
        run: |
          images="${{ github.event.inputs.docker_images }}"
          IFS=',' read -r -a image_array <<< "$images"
          for image in "${image_array[@]}"; do
            docker pull "${image}" --platform "linux/amd64"
            image_name="${image//\//_}"
            image_name="${image_name//:/_}"
            docker save "${image}" -o "${image_name}-amd64.tar"
            gzip -c "${image_name}-amd64.tar" > "${image_name}-amd64.tar.gz"
            rm "${image_name}-amd64.tar"
          done

      - name: List generated files (debug step)
        run: |
          echo "Preparing docker images list (.tar.gz) files:"
          find $GITHUB_WORKSPACE -name "*.tar.gz"
          release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
          echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: DockerTarBuilder-AMD64
          name: ${{ env.RELEASE_NAME }} for x86-64
          body: |
            [![Github](https://img.shields.io/badge/RELEASE:DockerTarBuilder-123456?logo=github&logoColor=fff&labelColor=green&style=for-the-badge)](https://www.bilibili.com/video/BV1EZ421M7mL) [![Github](https://img.shields.io/badge/国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge)](https://wkdaily.cpolar.top/archives/1)
            ### How to use? For example
            `docker load -i alpine_latest.tar.gz `
            ### Video teaching
            [![Bilibili](https://img.shields.io/badge/Bilibili-123456?logo=bilibili&logoColor=fff&labelColor=fb7299)](https://www.bilibili.com/video/BV1yyq6YREdF)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Docker images as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: DockerTarBuilder-AMD64
          files: ${{ github.workspace }}/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check SMTP secrets (optional email)
        id: smtp_check
        if: ${{ github.event.inputs.notify_email != '' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            echo "can_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification (optional)
        if: ${{ github.event.inputs.notify_email != '' && steps.smtp_check.outputs.can_send == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[DockerTarBuilder] AMD64 镜像构建完成"
          to: ${{ github.event.inputs.notify_email }}
          from: DockerTarBuilder <${{ secrets.SMTP_USER }}>
          html_body: |
            <p>你的镜像构建已完成。</p>
            <p><strong>镜像输入：</strong> ${{ github.event.inputs.docker_images }}</p>
            <p><strong>下载地址：</strong>
            <a href="https://github.com/${{ github.repository }}/releases/tag/DockerTarBuilder-AMD64">
            https://github.com/${{ github.repository }}/releases/tag/DockerTarBuilder-AMD64</a></p>
            <p>提示：大文件不建议走邮箱附件，建议从 Releases 下载。</p>

      - name: Warn when notify_email is set but SMTP secrets are missing
        if: ${{ github.event.inputs.notify_email != '' && steps.smtp_check.outputs.can_send != 'true' }}
        run: |
          echo "[WARN] 你填写了 notify_email，但未配置 SMTP_USER/SMTP_PASS，已跳过邮件发送。"
          echo "[WARN] 不影响镜像打包与 Release 上传，仍可按原方式下载。"
